name: pypi-check

# Installs the published package from PyPI the ways the README and burnmeter.dev
# say, on every OS Burnmeter ships for: `pipx install burnmeter` (then the dashboard
# must come up and report the right version) and `pip install "burnmeter[app]"`.
# Runs after each PyPI publish, by hand, and when this file changes.

on:
  workflow_run:
    workflows: [pypi]
    types: [completed]
  workflow_dispatch:
  push:
    # Branch pushes only: a release tag is pushed before PyPI has the new version.
    branches: [main]
    paths: ['.github/workflows/pypi-check.yml']

permissions:
  contents: read

jobs:
  install:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    name: install on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: pipx install burnmeter, then start the dashboard
        shell: bash
        run: |
          # The runner image points pipx at its own folders; use a user's defaults instead.
          unset PIPX_HOME PIPX_BIN_DIR PIPX_MAN_DIR
          python -m pip install --upgrade pipx
          python - <<'PY'
          import json, os, pathlib, subprocess, sys, time, tomllib, urllib.request

          version = tomllib.loads(pathlib.Path("pyproject.toml").read_text())["project"]["version"]
          pipx = [sys.executable, "-m", "pipx"]
          # PyPI's index can lag an upload by a few minutes, and pip keeps an index page it
          # has fetched for ten minutes: without --no-cache-dir every retry reads the same
          # stale page (the 0.3.9 run on macOS saw only 0.3.8 ten times in a row).
          for attempt in range(16):
              if subprocess.run(pipx + ["install", "--pip-args=--no-cache-dir",
                                        f"burnmeter=={version}"]).returncode == 0:
                  break
              time.sleep(30)
          else:
              sys.exit(f"pipx install burnmeter=={version} failed")
          bin_dir = subprocess.run(pipx + ["environment", "--value", "PIPX_BIN_DIR"],
                                   capture_output=True, text=True, check=True).stdout.strip()
          exe = os.path.join(bin_dir, "burnmeter.exe" if os.name == "nt" else "burnmeter")
          server = subprocess.Popen([exe, "serve", "--no-browser", "--no-shortcut", "--port", "7654"])
          try:
              for _ in range(60):
                  try:
                      with urllib.request.urlopen("http://127.0.0.1:7654/api/health", timeout=2) as r:
                          health = json.load(r)
                      break
                  except OSError:
                      time.sleep(1)
              else:
                  sys.exit("the dashboard never answered /api/health")
              assert health.get("version") == version, health
              with urllib.request.urlopen("http://127.0.0.1:7654/", timeout=10) as r:
                  assert b"Burnmeter" in r.read(), "the dashboard page is missing"
              print(f"burnmeter {version} from PyPI via pipx: dashboard up at {exe}")
          finally:
              server.terminate()
          PY

      - name: pip install "burnmeter[app]" (the macOS & Linux line on burnmeter.dev)
        shell: bash
        run: |
          version=$(python -c "import tomllib; print(tomllib.load(open('pyproject.toml', 'rb'))['project']['version'])")
          python -m venv "$RUNNER_TEMP/app"
          if [ "$RUNNER_OS" = Windows ]; then py="$RUNNER_TEMP/app/Scripts/python"; else py="$RUNNER_TEMP/app/bin/python"; fi
          "$py" -m pip install --upgrade --no-cache-dir "burnmeter[app]==$version"
          "$py" -m pip show burnmeter pywebview pystray Pillow | grep -E "^(Name|Version):"
