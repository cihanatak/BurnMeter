name: build-macos

# Builds the macOS .app + .dmg on GitHub's macOS runner (no Mac needed locally).
# - workflow_dispatch: manual test run → .dmg as a downloadable artifact.
# - release published: also attaches Burnmeter.dmg (+ versioned) to the release.
# UNSIGNED for now (Gatekeeper right-click→Open) until Apple Developer signing.

on:
  workflow_dispatch:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Build .app + .dmg
        run: bash packaging/build_mac.sh

      - name: Upload .dmg artifact
        uses: actions/upload-artifact@v4
        with:
          name: Burnmeter-macos
          path: dist/*.dmg
          if-no-files-found: error

      # build_mac.sh names the copy after __version__ (Burnmeter-0.3.5.dmg), not the tag
      # (v0.3.5). Asking for the tag's name failed, and a silent fallback hid that for
      # every release. Upload the stable name first, then the copy; if the copy is
      # missing, the tag and __version__ disagree and the job goes red.
      - name: Attach to release
        if: github.event_name == 'release'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.release.tag_name }}
        run: |
          gh release upload "$TAG" dist/Burnmeter.dmg --clobber
          gh release upload "$TAG" "dist/Burnmeter-${TAG#v}.dmg" --clobber
