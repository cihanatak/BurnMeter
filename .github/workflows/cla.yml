name: cla

# Contributor License Agreement check for pull requests (text: .github/CLA.md).
# A contributor signs by commenting the sentence from CLA.md on their PR; the
# action commits the signature to signatures/version1/cla.json on the
# `cla-signatures` branch, which must exist and must not be branch-protected.
#
# contributor-assistant/github-action was archived in March 2026 (its releases
# still work). It is pinned to the v2.6.1 commit so its code can't change. It
# never checks out or runs pull-request code, which is what keeps
# pull_request_target safe here.

on:
  issue_comment:
    types: [created]
  pull_request_target:
    types: [opened, closed, synchronize]

permissions:
  actions: write
  contents: write
  pull-requests: write
  statuses: write

jobs:
  cla:
    runs-on: ubuntu-latest
    if: >-
      github.event_name == 'pull_request_target' ||
      (github.event.issue.pull_request &&
       (github.event.comment.body == 'recheck' ||
        github.event.comment.body == 'I have read the CLA Document and I hereby sign the CLA'))
    steps:
      - name: CLA Assistant
        uses: contributor-assistant/github-action@ca4a40a7d1004f18d9960b404b97e5f30a505a08 # v2.6.1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          path-to-document: https://github.com/cihanatak/BurnMeter/blob/main/.github/CLA.md
          path-to-signatures: signatures/version1/cla.json
          branch: cla-signatures
          allowlist: cihanatak,dependabot[bot],github-actions[bot]
