name: pypi

# Publishes the burnmeter package to PyPI (https://pypi.org/project/burnmeter/)
# when a GitHub release is published, or by hand (Actions → pypi → Run workflow).
# PyPI Trusted Publishing: PyPI trusts this workflow file in cihanatak/BurnMeter,
# environment "pypi", so no API token is stored anywhere. PyPI never takes the
# same version twice, so a run for a version that is already there fails at upload.

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      # The dashboard is package data; a wheel without it installs but serves nothing.
      - name: Build sdist and wheel
        run: |
          python -m pip install --upgrade build twine
          python -m build
          python -m twine check --strict dist/*
          python -c "import glob, zipfile; names = zipfile.ZipFile(glob.glob('dist/*.whl')[0]).namelist(); assert 'burnmeter/static/dashboard.html' in names, names"

      - uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist/

  publish:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: pypi
      url: https://pypi.org/project/burnmeter/
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist/

      - uses: pypa/gh-action-pypi-publish@release/v1
