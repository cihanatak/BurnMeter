<!doctype html>
<html lang="en"><head><meta charset="utf-8" />
<!-- Source for og.png (1200x630). It embeds dashboard.png: the v0.3.8 dashboard on synthetic demo data
     (tests/generate_fixture.py --heavy), no real usage. Render: chrome --headless --window-size=1200,630 --screenshot=og.png file://.../og.html -->
<style>
*{margin:0;box-sizing:border-box}
body{width:1200px;height:630px;overflow:hidden;display:flex;flex-direction:column;
  background:radial-gradient(120% 120% at 0% 0%,rgba(16,163,127,.13),transparent 50%),radial-gradient(120% 120% at 100% 100%,rgba(94,106,210,.18),transparent 55%),#08090A;
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;color:#F7F8F8;letter-spacing:-.022em}
.top{padding:46px 64px 0}
.brand{display:flex;align-items:center;gap:14px;margin-bottom:20px}
.mark{width:44px;height:44px;border-radius:12px;background:linear-gradient(140deg,#10A37F,#5E6AD2 82%);
  display:grid;place-items:center;font-size:27px;color:#fff;box-shadow:0 10px 34px -8px rgba(94,106,210,.6),inset 0 1px 0 rgba(255,255,255,.3)}
.brand b{font-size:28px;font-weight:700}
h1{font-size:48px;line-height:1.06;font-weight:700;margin-bottom:10px}
.s{font-size:26px;color:#8A8F98;font-weight:500}
.shot{flex:none;margin:30px 64px 0;height:420px;overflow:hidden;border-radius:14px;
  border:1px solid rgba(255,255,255,.12);box-shadow:0 24px 80px -20px rgba(0,0,0,.8)}
.shot img{display:block;width:1245px;margin-left:-173px}
</style></head>
<body>
  <div class="top">
    <div class="brand"><div class="mark">◔</div><b>Burnmeter</b></div>
    <h1>A live $/hour meter for Claude Code and Codex</h1>
    <div class="s">against your own normal pace, chat by chat</div>
  </div>
  <div class="shot"><img src="dashboard.png" alt="" /></div>
</body></html>
