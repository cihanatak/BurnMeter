[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "burnmeter"
version = "0.3.9"
description = "A live $/hour meter for Claude Code and Codex, against your own normal pace, chat by chat."
readme = "README.md"
requires-python = ">=3.10"
license = "AGPL-3.0-or-later"
license-files = ["LICENSE", "LICENSING.md"]
authors = [{ name = "Cihan Atak" }]
keywords = ["claude-code", "codex", "tokens", "cost", "burn-rate", "dashboard", "ai-coding", "usage"]
# Runtime is the Python standard library plus ONE small dependency: backports.zstd, the
# backport of Python 3.14's compression.zstd, needed to read Codex CLI 0.164+'s compressed
# session logs (rollout-*.jsonl.zst). Python 3.14+ has it built in and installs nothing.
# (Chart.js / GridStack are CDN-loaded in the browser.)
dependencies = [
  'backports.zstd>=1.0; python_version < "3.14"',
]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Console",
  "Environment :: Web Environment",
  "Intended Audience :: Developers",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Software Development",
  "Topic :: Utilities",
]

# Optional extras keep the free local core dependency-free; opt in as needed.
#   [sync] — Pro cross-device sync (E2E encryption).
#   [tray] — system-tray launcher (no console window). Pillow>=10.3 has cp313
#            wheels and avoids a source-build trap on Python 3.13.
[project.optional-dependencies]
sync = ["cryptography>=42"]
tray = ["pystray>=0.19.4", "Pillow>=10.3"]
app = ["pywebview>=5.0", "pystray>=0.19.4", "Pillow>=10.3"]

[project.urls]
Homepage = "https://burnmeter.dev"
Repository = "https://github.com/cihanatak/BurnMeter"
Issues = "https://github.com/cihanatak/BurnMeter/issues"
Changelog = "https://github.com/cihanatak/BurnMeter/blob/main/CHANGELOG.md"

[project.scripts]
burnmeter = "burnmeter.cli:main"

[tool.setuptools]
# Bundle the dashboard assets WITH the package so a pip-installed burnmeter serves the UI.
packages = ["burnmeter"]

[tool.setuptools.package-data]
burnmeter = ["static/*", "assets/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
